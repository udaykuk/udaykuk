<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" role="img" aria-label="A desk at night with two monitors: a game on the left screen and code on the right">
  <style>
    .px { shape-rendering: crispEdges; }
    .mono { font-family: 'Fira Code', Consolas, 'Courier New', monospace; }
    .tw { animation: tw 2.4s ease-in-out infinite; }
    .tw2 { animation: tw 3.1s ease-in-out infinite 0.8s; }
    .tw3 { animation: tw 1.9s ease-in-out infinite 1.3s; }
    @keyframes tw { 0%, 100% { opacity: 1; } 50% { opacity: 0.15; } }

    .scroll { animation: scroll 5s linear infinite; }
    .scroll2 { animation: scroll 9s linear infinite; }
    @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-184px); } }

    .ship { animation: ship 3.2s ease-in-out infinite; }
    @keyframes ship { 0%, 100% { transform: translateY(-26px); } 50% { transform: translateY(24px); } }
    .flame { animation: tw 0.25s linear infinite; }

    .shot { animation: shot 0.9s linear infinite; }
    .shot.b { animation-delay: 0.45s; }
    @keyframes shot { from { transform: translateX(0); opacity: 1; } 90% { opacity: 1; } to { transform: translateX(150px); opacity: 0; } }

    .foe { animation: foe 4.5s linear infinite backwards; }
    .foe.f2 { animation-delay: 1.5s; }
    .foe.f3 { animation-delay: 3s; }
    @keyframes foe { from { transform: translateX(0); } to { transform: translateX(-230px); } }

    .score { animation: tw 1.2s steps(2) infinite; }

    .ln { transform-box: fill-box; transform-origin: left center; animation: type 9s steps(14) infinite backwards; }
    @keyframes type { 0% { transform: scaleX(0); } 7% { transform: scaleX(1); } 88% { transform: scaleX(1); } 93%, 100% { transform: scaleX(0); } }
    .cursor { animation: blink 0.9s steps(2) infinite; }
    @keyframes blink { 0% { opacity: 1; } 100% { opacity: 0; } }

    .rgb { animation: rgb 6s linear infinite; }
    @keyframes rgb { 0% { fill: #ff3d81; } 25% { fill: #7c5cff; } 50% { fill: #1d9bf7; } 75% { fill: #00e676; } 100% { fill: #ff3d81; } }
    .fan { transform-box: fill-box; transform-origin: center; animation: spin 1.2s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .neon { animation: neon 5s linear infinite; }
    @keyframes neon { 0%, 46%, 50%, 100% { opacity: 1; } 48% { opacity: 0.35; } }

    .steam { animation: steam 3s ease-out infinite; }
    .steam.s2 { animation-delay: 1.5s; }
    @keyframes steam { from { transform: translateY(0); opacity: 0.7; } to { transform: translateY(-22px); opacity: 0; } }

    .head { animation: nod 4s ease-in-out infinite; }
    @keyframes nod { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(1.5px); } }
    .glowL { animation: glow 3.2s ease-in-out infinite; }
    @keyframes glow { 0%, 100% { opacity: 0.20; } 50% { opacity: 0.32; } }
  </style>

  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17152b"/>
      <stop offset="1" stop-color="#0e0d1a"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1440"/>
      <stop offset="1" stop-color="#2a1b5c"/>
    </linearGradient>
    <radialGradient id="lightGame" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lightCode" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1d9bf7"/>
      <stop offset="1" stop-color="#1d9bf7" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clipGame"><rect x="178" y="98" width="184" height="118"/></clipPath>
    <clipPath id="clipCode"><rect x="438" y="98" width="184" height="118"/></clipPath>
    <clipPath id="round"><rect width="800" height="340" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="800" height="340" fill="url(#wall)"/>

    <!-- window with night sky -->
    <g class="px">
      <rect x="34" y="34" width="112" height="124" fill="#2b2444"/>
      <rect x="40" y="40" width="100" height="112" fill="url(#sky)"/>
      <rect x="88" y="40" width="4" height="112" fill="#2b2444"/>
      <rect x="40" y="94" width="100" height="4" fill="#2b2444"/>
      <circle cx="116" cy="62" r="11" fill="#f5e9b8"/>
      <circle cx="121" cy="58" r="10" fill="#101a48"/>
      <rect class="tw" x="52" y="54" width="3" height="3" fill="#ffffff"/>
      <rect class="tw2" x="70" y="76" width="2" height="2" fill="#ffffff"/>
      <rect class="tw3" x="62" y="118" width="3" height="3" fill="#ffffff"/>
      <rect class="tw" x="104" y="110" width="2" height="2" fill="#ffffff"/>
      <rect class="tw2" x="126" y="130" width="3" height="3" fill="#ffffff"/>
      <rect class="tw3" x="48" y="138" width="2" height="2" fill="#ffffff"/>
    </g>

    <!-- neon sign -->
    <g class="neon mono" font-size="15" font-weight="700" text-anchor="middle">
      <rect x="316" y="26" width="168" height="34" rx="8" fill="none" stroke="#ff3d81" stroke-width="2" opacity="0.9"/>
      <text x="400" y="48" fill="#ff7eb0">GAME · CODE · REPEAT</text>
    </g>

    <!-- shelf with books and a plant -->
    <g class="px">
      <rect x="664" y="96" width="104" height="6" fill="#3a2b52"/>
      <rect x="672" y="66" width="9" height="30" fill="#ff3d81"/>
      <rect x="682" y="72" width="8" height="24" fill="#1d9bf7"/>
      <rect x="691" y="62" width="10" height="34" fill="#f5c542"/>
      <rect x="702" y="70" width="8" height="26" fill="#00e676"/>
      <rect x="732" y="82" width="20" height="14" fill="#8a5a3c"/>
      <rect x="738" y="64" width="4" height="18" fill="#2fbf71"/>
      <rect x="730" y="68" width="8" height="5" fill="#2fbf71"/>
      <rect x="742" y="60" width="9" height="5" fill="#2fbf71"/>
      <rect x="744" y="72" width="8" height="5" fill="#2fbf71"/>
    </g>

    <!-- screen light spilling into the room -->
    <ellipse class="glowL" cx="270" cy="170" rx="190" ry="120" fill="url(#lightGame)"/>
    <ellipse class="glowL" cx="530" cy="170" rx="190" ry="120" fill="url(#lightCode)"/>

    <!-- desk -->
    <g class="px">
      <rect x="70" y="252" width="660" height="14" fill="#4a3566"/>
      <rect x="70" y="266" width="660" height="6" fill="#2f2145"/>
      <rect x="92" y="272" width="14" height="68" fill="#2f2145"/>
      <rect x="694" y="272" width="14" height="68" fill="#2f2145"/>
    </g>

    <!-- mug with steam -->
    <g>
      <rect class="steam" x="112" y="218" width="3" height="10" rx="1.5" fill="#cfd3ff"/>
      <rect class="steam s2" x="121" y="216" width="3" height="10" rx="1.5" fill="#cfd3ff"/>
      <g class="px">
        <rect x="106" y="232" width="24" height="20" fill="#f1f1f6"/>
        <rect x="130" y="236" width="6" height="10" fill="none" stroke="#f1f1f6" stroke-width="3"/>
        <rect x="106" y="240" width="24" height="4" fill="#ff3d81"/>
      </g>
    </g>

    <!-- PC tower with RGB fan -->
    <g>
      <rect class="px" x="652" y="172" width="54" height="80" fill="#1a1a2a" stroke="#34304f" stroke-width="2"/>
      <circle cx="679" cy="200" r="15" fill="#0d0d18"/>
      <g class="fan">
        <rect class="rgb" x="677" y="186" width="4" height="28"/>
        <rect class="rgb" x="665" y="198" width="28" height="4"/>
      </g>
      <rect class="rgb px" x="660" y="230" width="38" height="3"/>
      <rect class="px tw" x="660" y="240" width="4" height="4" fill="#00e676"/>
    </g>

    <!-- left monitor: the game -->
    <g>
      <rect class="px" x="170" y="90" width="200" height="134" rx="4" fill="#1b1b2b" stroke="#34304f" stroke-width="2"/>
      <rect x="178" y="98" width="184" height="118" fill="#070b24"/>
      <g clip-path="url(#clipGame)">
        <g class="scroll2 px" fill="#5b6bd6">
          <rect x="190" y="108" width="2" height="2"/><rect x="240" y="150" width="2" height="2"/><rect x="300" y="122" width="2" height="2"/><rect x="340" y="190" width="2" height="2"/><rect x="215" y="200" width="2" height="2"/>
          <rect x="374" y="108" width="2" height="2"/><rect x="424" y="150" width="2" height="2"/><rect x="484" y="122" width="2" height="2"/><rect x="524" y="190" width="2" height="2"/><rect x="399" y="200" width="2" height="2"/>
        </g>
        <g class="scroll px" fill="#ffffff">
          <rect x="205" y="130" width="3" height="3"/><rect x="270" y="176" width="3" height="3"/><rect x="330" y="112" width="3" height="3"/><rect x="290" y="204" width="3" height="3"/>
          <rect x="389" y="130" width="3" height="3"/><rect x="454" y="176" width="3" height="3"/><rect x="514" y="112" width="3" height="3"/><rect x="474" y="204" width="3" height="3"/>
        </g>

        <g class="foe px">
          <rect x="372" y="118" width="14" height="10" fill="#ff3d81"/><rect x="368" y="122" width="4" height="4" fill="#ff3d81"/><rect x="376" y="121" width="3" height="3" fill="#070b24"/>
        </g>
        <g class="foe f2 px">
          <rect x="372" y="152" width="14" height="10" fill="#f5c542"/><rect x="368" y="156" width="4" height="4" fill="#f5c542"/><rect x="376" y="155" width="3" height="3" fill="#070b24"/>
        </g>
        <g class="foe f3 px">
          <rect x="372" y="184" width="14" height="10" fill="#00e676"/><rect x="368" y="188" width="4" height="4" fill="#00e676"/><rect x="376" y="187" width="3" height="3" fill="#070b24"/>
        </g>

        <g class="ship">
          <g class="px">
            <rect class="flame" x="188" y="155" width="6" height="4" fill="#ff9d2e"/>
            <rect x="194" y="150" width="14" height="14" fill="#cfd3ff"/>
            <rect x="208" y="154" width="8" height="6" fill="#7c5cff"/>
            <rect x="196" y="145" width="6" height="5" fill="#7c5cff"/>
            <rect x="196" y="164" width="6" height="5" fill="#7c5cff"/>
            <rect class="shot" x="218" y="156" width="8" height="2" fill="#7df9ff"/>
            <rect class="shot b" x="218" y="156" width="8" height="2" fill="#7df9ff"/>
          </g>
        </g>

        <g class="mono" font-size="8" fill="#7df9ff">
          <text x="184" y="109">SCORE 04200</text>
          <text class="score" x="318" y="109" fill="#ff3d81">♥ ♥ ♥</text>
        </g>
      </g>
      <rect class="px" x="262" y="224" width="16" height="20" fill="#1b1b2b"/>
      <rect class="px" x="236" y="244" width="68" height="8" fill="#1b1b2b"/>
      <rect class="rgb px" x="170" y="226" width="200" height="2" opacity="0.8"/>
    </g>

    <!-- right monitor: the code editor -->
    <g>
      <rect class="px" x="430" y="90" width="200" height="134" rx="4" fill="#1b1b2b" stroke="#34304f" stroke-width="2"/>
      <rect x="438" y="98" width="184" height="118" fill="#0d1117"/>
      <g clip-path="url(#clipCode)">
        <rect class="px" x="438" y="98" width="184" height="12" fill="#161b22"/>
        <circle cx="446" cy="104" r="2.5" fill="#ff5f56"/><circle cx="454" cy="104" r="2.5" fill="#ffbd2e"/><circle cx="462" cy="104" r="2.5" fill="#27c93f"/>
        <text class="mono" x="530" y="107" font-size="7" fill="#8b949e" text-anchor="middle">Main.java</text>
        <rect class="px" x="438" y="110" width="16" height="106" fill="#10151c"/>
        <g class="px" fill="#3b4350">
          <rect x="443" y="118" width="6" height="3"/><rect x="443" y="128" width="6" height="3"/><rect x="443" y="138" width="6" height="3"/><rect x="443" y="148" width="6" height="3"/><rect x="443" y="158" width="6" height="3"/><rect x="443" y="168" width="6" height="3"/><rect x="443" y="178" width="6" height="3"/><rect x="443" y="188" width="6" height="3"/><rect x="443" y="198" width="6" height="3"/>
        </g>
        <g class="px">
          <g class="ln" style="animation-delay:0s"><rect x="460" y="117" width="26" height="4" fill="#ff7b72"/><rect x="490" y="117" width="34" height="4" fill="#79c0ff"/><rect x="528" y="117" width="8" height="4" fill="#c9d1d9"/></g>
          <g class="ln" style="animation-delay:0.5s"><rect x="470" y="127" width="22" height="4" fill="#ff7b72"/><rect x="496" y="127" width="18" height="4" fill="#ffa657"/><rect x="518" y="127" width="44" height="4" fill="#d2a8ff"/><rect x="566" y="127" width="8" height="4" fill="#c9d1d9"/></g>
          <g class="ln" style="animation-delay:1s"><rect x="480" y="137" width="30" height="4" fill="#79c0ff"/><rect x="514" y="137" width="6" height="4" fill="#c9d1d9"/><rect x="524" y="137" width="52" height="4" fill="#a5d6ff"/></g>
          <g class="ln" style="animation-delay:1.5s"><rect x="480" y="147" width="14" height="4" fill="#ff7b72"/><rect x="498" y="147" width="40" height="4" fill="#c9d1d9"/><rect x="542" y="147" width="10" height="4" fill="#79c0ff"/></g>
          <g class="ln" style="animation-delay:2s"><rect x="490" y="157" width="46" height="4" fill="#d2a8ff"/><rect x="540" y="157" width="34" height="4" fill="#a5d6ff"/></g>
          <g class="ln" style="animation-delay:2.5s"><rect x="490" y="167" width="24" height="4" fill="#ff7b72"/><rect x="518" y="167" width="28" height="4" fill="#79c0ff"/></g>
          <g class="ln" style="animation-delay:3s"><rect x="480" y="177" width="8" height="4" fill="#c9d1d9"/></g>
          <g class="ln" style="animation-delay:3.5s"><rect x="480" y="187" width="62" height="4" fill="#8b949e"/></g>
          <g class="ln" style="animation-delay:4s"><rect x="470" y="197" width="8" height="4" fill="#c9d1d9"/></g>
          <rect class="cursor" x="482" y="196" width="3" height="6" fill="#58a6ff"/>
        </g>
      </g>
      <rect class="px" x="522" y="224" width="16" height="20" fill="#1b1b2b"/>
      <rect class="px" x="496" y="244" width="68" height="8" fill="#1b1b2b"/>
      <rect class="rgb px" x="430" y="226" width="200" height="2" opacity="0.8"/>
    </g>

    <!-- me, from behind, with headphones -->
    <g>
      <g class="px">
        <rect x="346" y="226" width="108" height="114" rx="10" fill="#15131f"/>
        <rect x="352" y="232" width="96" height="108" rx="8" fill="#211d33"/>
      </g>
      <path d="M352 340 L352 276 Q352 246 384 242 L416 242 Q448 246 448 276 L448 340 Z" fill="#2d6cdf"/>
      <path d="M384 242 Q400 256 416 242 L416 250 Q400 264 384 250 Z" fill="#1f56ba"/>
      <g class="head">
        <rect x="392" y="226" width="16" height="20" fill="#d9a07a"/>
        <circle cx="400" cy="204" r="27" fill="#231a16"/>
        <path d="M373 204 Q373 172 400 172 Q427 172 427 204" fill="none" stroke="#ff3d81" stroke-width="6" stroke-linecap="round"/>
        <rect x="364" y="194" width="13" height="26" rx="5" fill="#ff3d81"/>
        <rect x="423" y="194" width="13" height="26" rx="5" fill="#ff3d81"/>
        <rect x="367" y="199" width="4" height="16" rx="2" fill="#ffd0e0"/>
        <rect x="429" y="199" width="4" height="16" rx="2" fill="#ffd0e0"/>
      </g>
    </g>

    <!-- floor glow -->
    <rect class="rgb" x="0" y="336" width="800" height="4" opacity="0.5"/>
  </g>
</svg>
